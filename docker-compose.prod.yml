services:
  migrator:
    container_name: esoft-migrator
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.prod
      target: build
    command: pnpm -F @repo/database db:migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    networks:
      - esoft_net

  backend:
    container_name: esoft-backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.prod
    env_file: .env
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_PORT: 3000
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - esoft_net
    healthcheck:
      test:
        [
          CMD-SHELL,
          "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: esoft-frontend
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - esoft_net

  postgres:
    image: postgres:17-alpine
    container_name: esoft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - esoft_net
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    container_name: esoft-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - esoft_net
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  esoft_net:
    driver: bridge
