services:
  postgres:
    image: postgres:17-alpine
    container_name: esoft-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: tiger
      POSTGRES_DB: esoft_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - esoft_net

  redis:
    image: redis:8.8-alpine
    container_name: esoft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - esoft_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: esoft-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - esoft_net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: esoft-cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    depends_on:
      - postgres
    networks:
      - esoft_net

volumes:
  postgres-data:
  redis-data:
  cloudbeaver-data:

networks:
  esoft_net:
    driver: bridge
