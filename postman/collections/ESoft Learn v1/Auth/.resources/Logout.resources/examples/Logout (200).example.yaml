$kind: "http-example"
request:
  url: "{{baseUrl}}/api/auth/logout"
  method: "POST"
  body:
    type: "json"
    content: |-
      {
          "refreshToken": "{{refreshToken}}"
      }
response:
  statusCode: 200
  statusText: "OK"
  body:
    type: "text"
    content: |-
      {
          "status": 200,
          "success": true,
          "message": "Выход выполнен",
          "data": null
      }
order: 1000
