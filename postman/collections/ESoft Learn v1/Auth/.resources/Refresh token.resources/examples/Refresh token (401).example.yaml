$kind: "http-example"
request:
  url: "{{baseUrl}}/api/auth/refresh"
  method: "POST"
  body:
    type: "json"
    content: |-
      {
          "refreshToken": "{{refreshToken}}"
      }
response:
  statusCode: 401
  statusText: "Unauthorized"
  body:
    type: "text"
    content: |-
      {
          "status": 401,
          "success": false,
          "message": "Refresh-токен недействителен или истёк"
      }
order: 1000
