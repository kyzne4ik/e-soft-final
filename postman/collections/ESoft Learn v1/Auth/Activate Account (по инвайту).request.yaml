$kind: http-request
name: Activate Account (по инвайту)
url: "{{baseUrl}}/api/auth/activate"
method: POST
body:
  type: json
  content: |-
    {
        "token": "{{inviteToken}}",
        "password": "newpass12345"
    }
auth:
  type: noauth
events:
  - listen: "afterResponse"
    script:
      type: "text/javascript"
      exec: |-
        const r = pm.response.json();
        if (r.data && r.data.accessToken && r.data.refreshToken) {
            pm.collectionVariables.set('accessToken', r.data.accessToken);
            pm.collectionVariables.set('refreshToken', r.data.refreshToken);
            console.log('Account activated');
        }
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      if (r.data && r.data.accessToken && r.data.refreshToken) {
          pm.collectionVariables.set('accessToken', r.data.accessToken);
          pm.collectionVariables.set('refreshToken', r.data.refreshToken);
      }
    language: text/javascript
examples: ./.resources/Activate Account (по инвайту).resources/examples
order: 7000
