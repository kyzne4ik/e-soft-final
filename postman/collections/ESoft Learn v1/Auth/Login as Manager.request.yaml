$kind: http-request
name: Login as Manager
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "nesterenko@esoft.fake",
        "password": "password123"
    }
auth:
  type: noauth
events:
  - listen: "afterResponse"
    script:
      type: "text/javascript"
      exec: |-
        const r = pm.response.json();
        if (r.data && r.data.accessToken && r.data.refreshToken) {
            pm.collectionVariables.set('accessToken', r.data.accessToken);
            pm.collectionVariables.set('refreshToken', r.data.refreshToken);
            console.log('Logged in as MANAGER');
        }
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      if (r.data && r.data.accessToken && r.data.refreshToken) {
          pm.collectionVariables.set('accessToken', r.data.accessToken);
          pm.collectionVariables.set('refreshToken', r.data.refreshToken);
      }
    language: text/javascript
examples: ./.resources/Login as Manager.resources/examples
order: 2000
