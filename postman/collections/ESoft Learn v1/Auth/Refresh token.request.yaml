$kind: http-request
name: Refresh token
url: "{{baseUrl}}/api/auth/refresh"
method: POST
body:
  type: json
  content: |-
    {
        "refreshToken": "{{refreshToken}}"
    }
events:
  - listen: "afterResponse"
    script:
      type: "text/javascript"
      exec: |-
        const r = pm.response.json();
        if (r.data && r.data.accessToken && r.data.refreshToken) {
            pm.collectionVariables.set('accessToken', r.data.accessToken);
            pm.collectionVariables.set('refreshToken', r.data.refreshToken);
            console.log('Update tokens');
        }
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      if (r.data && r.data.accessToken && r.data.refreshToken) {
          pm.collectionVariables.set('accessToken', r.data.accessToken);
          pm.collectionVariables.set('refreshToken', r.data.refreshToken);
      }
    language: text/javascript
examples: ./.resources/Refresh token.resources/examples
order: 9000
