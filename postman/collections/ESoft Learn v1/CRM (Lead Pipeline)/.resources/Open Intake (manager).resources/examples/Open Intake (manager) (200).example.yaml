$kind: http-example
request:
  url: "{{baseUrl}}/api/crm/intake/open"
  method: POST
  body:
    type: json
    content: |-
      {
          "streamId": 1,
          "expiresIn": 3600
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
          "status": 200,
          "success": true,
          "message": "Набор открыт",
          "data": {
              "token": ""
          }
      }
order: 1000
