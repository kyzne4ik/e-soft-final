$kind: "http-request"
url: "{{baseUrl}}/api/intake"
method: "POST"
body:
  type: "json"
  content: |-
    {
        "firstName": "Кирилл",
        "lastName": "Заявкин",
        "patronymic": "Игоревич",
        "email": "kirill@cand.dev",
        "phone": "+79991112233",
        "telegram": "@kirill",
        "experience": "1 год на JS",
        "testResult": "https://docs.google.com/forms/d/1RtqdyKa2qf_TXn--0F7u48CiUCyaBqg4jmaRCcWr_N8/edit#response=ACYDBNg9VXZP8m7DM0B8azPXS1dhySbg7nPCLlvpkvaQe6QZAmREb7aG244T1Bw9MfxFNT0"
    }
auth:
  type: bearer
  credentials:
    token: "{{intakeToken}}"
documentation:
  content: |-
    Публичный приём заявки абитуриента (без сессии). Авторизация — ingest-JWT в заголовке Authorization: Bearer {{intakeToken}}, полученный через «Open Intake (manager)». streamId берётся из подписи токена (в теле его нет), тело — данные абитуриента (createLeadPayload).

    Ответ 201. Повторная отправка с тем же email обновляет существующую заявку (upsert по email). Набор должен быть открыт — поток в статусе ENROLLING, иначе 403.
examples: "./.resources/Public Intake (ingest-JWT).resources/examples"
order: 6000
