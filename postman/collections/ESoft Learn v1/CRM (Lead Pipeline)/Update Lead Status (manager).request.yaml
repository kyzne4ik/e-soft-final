$kind: "http-request"
url: "{{baseUrl}}/api/crm/leads/:id/status"
method: "PATCH"
pathVariables:
- key: "id"
  value: "1"
body:
  type: "json"
  content: |-
    {
        "status": "ACCEPTED"
    }
events:
- listen: "afterResponse"
  script:
    type: "text/javascript"
    exec: |-
      const r = pm.response.json();
      if (r.data && r.data.invite && r.data.invite.token) {
          pm.collectionVariables.set('inviteToken', r.data.invite.token);
          console.log('Welcome invite token saved (lead converted)');
      }
examples: "./.resources/Update Lead Status (manager).resources/examples"
order: 4000
