$kind: "http-example"
request:
  url: "{{baseUrl}}/api/notifications"
  method: "POST"
  body:
    type: "json"
    content: |-
      {
          "userId": 5,
          "message": "Важное системное сообщение",
          "isSilent": false
      }
response:
  statusCode: 409
  statusText: "Conflict"
  body:
    type: "json"
    content: |-
      {
          "status": 409,
          "success": false,
          "message": "Невозможно выполнить операцию: есть связанные записи (уведомления)"
      }
order: 3000
