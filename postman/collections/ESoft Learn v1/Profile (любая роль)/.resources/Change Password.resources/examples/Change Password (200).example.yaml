$kind: "http-example"
request:
  url: "{{baseUrl}}/api/profile/password"
  method: "PATCH"
  body:
    type: "json"
    content: |-
      {
          "oldPassword": "admin123",
          "newPassword": "newpass1234"
      }
response:
  statusCode: 200
  statusText: "OK"
  body:
    type: "json"
    content: |-
      {
          "status": 200,
          "success": true,
          "message": "Пароль изменён",
          "data": null
      }
order: 1000
