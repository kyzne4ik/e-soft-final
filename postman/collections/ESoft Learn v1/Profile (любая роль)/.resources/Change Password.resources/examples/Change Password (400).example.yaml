$kind: "http-example"
request:
  url: "{{baseUrl}}/api/profile/password"
  method: "PATCH"
  body:
    type: "json"
    content: |-
      {
          "oldPassword": "newpass1234",
          "newPassword": "newpass12345"
      }
response:
  statusCode: 400
  statusText: "Bad Request"
  body:
    type: "json"
    content: |-
      {
          "status": 400,
          "success": false,
          "message": "Текущий пароль неверен"
      }
order: 2000
