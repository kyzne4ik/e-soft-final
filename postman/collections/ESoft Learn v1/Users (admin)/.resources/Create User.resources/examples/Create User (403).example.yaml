$kind: "http-example"
request:
  url: "{{baseUrl}}/api/users"
  method: "POST"
  body:
    type: "json"
    content: |-
      {
          "firstName": "Студент",
          "lastName": "Студентов",
          "patronymic": "Студентович",
          "email": "student2@student.stud",
          "password": "password123",
          "role": "STUDENT"
      }
